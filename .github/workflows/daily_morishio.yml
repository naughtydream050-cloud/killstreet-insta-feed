name: Daily Morishio Manga Package

on:
  schedule:
    # 09:00 Asia/Tokyo = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Optional DAY number to generate manually, 1-30. Empty = calculate from start_date in JST."
        required: false
        default: ""
      start_date:
        description: "Start date in Asia/Tokyo, YYYY-MM-DD. First scheduled run should be DAY01."
        required: false
        default: "2026-06-26"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      MORISHIO_START_DATE: ${{ github.event.inputs.start_date || '2026-06-26' }}
      MORISHIO_MANUAL_DAY: ${{ github.event.inputs.day }}
      MORISHIO_OUTPUT_DIR: generated/morishio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate today's 5 numbered manga post images and caption
        run: |
          python scripts/generate_morishio_daily.py \
            --start-date "$MORISHIO_START_DATE" \
            --manual-day "$MORISHIO_MANUAL_DAY" \
            --output-dir "$MORISHIO_OUTPUT_DIR"

      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MORISHIO_OUTPUT_DIR"
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            DAY_DIR=$(find "$MORISHIO_OUTPUT_DIR" -maxdepth 1 -type d -name 'DAY*' | sort | tail -n 1)
            git commit -m "Generate Morishio daily package ${DAY_DIR##*/}"
            git push
          fi

      - name: Upload generated package artifact
        uses: actions/upload-artifact@v4
        with:
          name: morishio-daily-package
          path: generated/morishio/DAY*
          if-no-files-found: error
