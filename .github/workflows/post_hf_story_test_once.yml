name: Post HF Story Test Once

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Public MP4 URL"
        required: true
      api_version:
        description: "Meta Graph API version"
        required: false
        default: "v25.0"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Publish Instagram Story video
        id: publish
        shell: bash
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          API_VERSION: ${{ github.event.inputs.api_version || 'v25.0' }}
        run: |
          set -euo pipefail
          if [ -z "${IG_USER_ID}" ] || [ -z "${INSTAGRAM_TOKEN}" ]; then
            echo "Missing IG_USER_ID or INSTAGRAM_TOKEN secret" >&2
            exit 1
          fi

          api="https://graph.facebook.com/${API_VERSION}"
          create_json="$(curl -sS -X POST "${api}/${IG_USER_ID}/media" \
            -d "media_type=STORIES" \
            --data-urlencode "video_url=${VIDEO_URL}" \
            -d "access_token=${INSTAGRAM_TOKEN}")"

          container_id="$(python -c 'import json,sys; data=json.loads(sys.argv[1]); print(data.get("id",""))' "${create_json}")"
          if [ -z "${container_id}" ]; then
            python -c 'import json,sys; data=json.loads(sys.argv[1]); print(json.dumps({"create_error": data.get("error", data)}, ensure_ascii=False))' "${create_json}" >&2
            exit 1
          fi
          echo "container_id=${container_id}"

          status="UNKNOWN"
          for i in $(seq 1 30); do
            status_json="$(curl -sS "${api}/${container_id}?fields=status_code&access_token=${INSTAGRAM_TOKEN}")"
            status="$(python -c 'import json,sys; data=json.loads(sys.argv[1]); print(data.get("status_code","UNKNOWN"))' "${status_json}")"
            echo "poll=${i} status=${status}"
            if [ "${status}" = "FINISHED" ]; then
              break
            fi
            if [ "${status}" = "ERROR" ] || [ "${status}" = "EXPIRED" ]; then
              python -c 'import json,sys; data=json.loads(sys.argv[1]); print(json.dumps({"status_error": data}, ensure_ascii=False))' "${status_json}" >&2
              exit 1
            fi
            sleep 10
          done

          if [ "${status}" != "FINISHED" ]; then
            echo "Container did not finish processing; final status=${status}" >&2
            exit 1
          fi

          publish_json="$(curl -sS -X POST "${api}/${IG_USER_ID}/media_publish" \
            -d "creation_id=${container_id}" \
            -d "access_token=${INSTAGRAM_TOKEN}")"
          story_id="$(python -c 'import json,sys; data=json.loads(sys.argv[1]); print(data.get("id",""))' "${publish_json}")"
          if [ -z "${story_id}" ]; then
            python -c 'import json,sys; data=json.loads(sys.argv[1]); print(json.dumps({"publish_error": data.get("error", data)}, ensure_ascii=False))' "${publish_json}" >&2
            exit 1
          fi

          echo "story_id=${story_id}" >> "${GITHUB_OUTPUT}"
          echo "STORY_ID=${story_id}"
