name: Post Brand Story

on:
  schedule:
    - cron: '0 0,6,12 * * *'   # JST 09:00 / 15:00 / 21:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run without Instagram story posting or story history update'
        required: false
        default: 'true'
      debug:
        description: 'Enable debug logs'
        required: false
        default: 'false'
      story_max_posts:
        description: 'Maximum stories per run; kept at 1'
        required: false
        default: '1'
      template_type:
        description: 'Story template'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning_worldview
          - afternoon_product
          - night_cta

jobs:
  post-story:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - run: pip install -r requirements.txt

      - name: Prepare story creative
        run: python brand_story_auto.py --prepare-only --template-type "${TEMPLATE_TYPE}"
        env:
          BASE_CLIENT_ID:     ${{ secrets.BASE_CLIENT_ID }}
          BASE_CLIENT_SECRET: ${{ secrets.BASE_CLIENT_SECRET }}
          BASE_REFRESH_TOKEN: ${{ secrets.BASE_REFRESH_TOKEN }}
          BASE_ACCESS_TOKEN:  ${{ secrets.BASE_ACCESS_TOKEN }}
          INSTAGRAM_TOKEN:    ${{ secrets.INSTAGRAM_TOKEN }}
          IG_USER_ID:         ${{ secrets.IG_USER_ID }}
          SHOP_ID:            ${{ secrets.SHOP_ID }}
          GH_PAT_SECRETS:     ${{ secrets.GH_PAT_SECRETS }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          COPY_AI_PROVIDER:   ${{ vars.COPY_AI_PROVIDER || 'gemini' }}
          COPY_AI_FALLBACK:   ${{ vars.COPY_AI_FALLBACK || 'true' }}
          SHOP_URL:           ${{ vars.SHOP_URL || 'https://killstreet2.base.shop/' }}
          SHOP_URL_DISPLAY:   ${{ vars.SHOP_URL_DISPLAY || 'KILLSTREET2.BASE.SHOP' }}
          DRY_RUN:            ${{ github.event.inputs.dry_run || 'false' }}
          STORY_MAX_POSTS:    ${{ github.event.inputs.story_max_posts || '1' }}
          TEMPLATE_TYPE:      ${{ github.event.inputs.template_type || 'auto' }}
          DEBUG:              ${{ github.event.inputs.debug || 'false' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Post prepared Instagram story
        run: python brand_story_auto.py --post-prepared .story_payload.json
        env:
          INSTAGRAM_TOKEN:  ${{ secrets.INSTAGRAM_TOKEN }}
          IG_USER_ID:       ${{ secrets.IG_USER_ID }}
          SHOP_URL:         ${{ vars.SHOP_URL || 'https://killstreet2.base.shop/' }}
          DRY_RUN:          ${{ github.event.inputs.dry_run || 'false' }}
          DEBUG:            ${{ github.event.inputs.debug || 'false' }}

      - name: Persist story_history.json
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add story_history.json
          if git diff --staged --quiet; then
            echo "[STORY HISTORY] No story history changes - nothing to commit"
          else
            git commit -m "chore: update story_history.json [skip ci]"
            git push
            echo "[STORY HISTORY] story_history.json pushed to GitHub"
          fi
