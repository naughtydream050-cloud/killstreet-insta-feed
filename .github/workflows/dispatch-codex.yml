name: Codex Dispatch

on:
  issues:
    types: [labeled]

jobs:
  run-codex:
    if: contains(github.event.issue.labels.*.name, 'dispatch')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Save issue body
        run: echo "${{ github.event.issue.body }}" > codex-issue-prompt.md

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Run Codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: codex exec codex-issue-prompt.md > codex-result.md

      - name: Comment result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('codex-result.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
