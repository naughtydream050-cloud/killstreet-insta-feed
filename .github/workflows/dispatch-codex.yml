name: dispatch-codex

on:
  issues:
    types: [labeled]

jobs:
  run:
    if: github.event.label.name == 'dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Run Codex
        run: |
          echo "${{ github.event.issue.body }}" > prompt.txt
          codex exec prompt.txt > result.txt

      - name: Comment result
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file result.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}