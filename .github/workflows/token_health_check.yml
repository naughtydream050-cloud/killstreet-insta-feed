name: Token Health Check

on:
  schedule:
    - cron: '30 23 * * *'   # JST 08:30
  workflow_dispatch:

jobs:
  token-health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run token health unit tests
        run: python -m unittest tests.test_token_health_check

      - name: Check and rotate tokens
        run: python scripts/token_health_check.py
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          BASE_CLIENT_ID: ${{ secrets.BASE_CLIENT_ID }}
          BASE_CLIENT_SECRET: ${{ secrets.BASE_CLIENT_SECRET }}
          BASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
          BASE_REFRESH_TOKEN: ${{ secrets.BASE_REFRESH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          GH_PAT_SECRETS: ${{ secrets.GH_PAT_SECRETS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION || 'v25.0' }}
          IG_REFRESH_THRESHOLD_DAYS: ${{ vars.IG_REFRESH_THRESHOLD_DAYS || '14' }}
